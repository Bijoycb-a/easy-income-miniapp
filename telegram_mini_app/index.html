<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xengiq Bot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 30px 20px;
            background: #1e293b;
            border-radius: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🤖 Xengiq Bot</h1>
        <p>Welcome to Xengiq Telegram Mini App</p>

        <button onclick="openApp()">
            Open App
        </button>
    </div>

    <script>
        function openApp() {
            alert("Xengiq Bot Mini App is working!");
        }
    </script>

</body>
</html>
